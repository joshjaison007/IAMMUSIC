[package]
name = "iammusic"
version = "1.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.9"
windows = { version = "0.58", features = [
    "Media_Control",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    "Foundation",
    "Foundation_Collections",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1"

[profile.release]
opt-level = 3
codegen-units = 16
strip = true
panic = "abort"
